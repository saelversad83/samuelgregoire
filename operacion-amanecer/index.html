<script>
"use strict";
const $=s=>document.querySelector(s);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const WS=1800,BK=300,RD=96;

/* ================= AUDIO ================= */
const Snd={ctx:null,musicOn:true,fxOn:true,step:0,next:0,intense:false};
function audioInit(){
 if(Snd.ctx){try{Snd.ctx.resume()}catch(e){}return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 const c=Snd.ctx=new AC();
 Snd.master=c.createGain();Snd.master.gain.value=.9;Snd.master.connect(c.destination);
 Snd.mus=c.createGain();Snd.mus.gain.value=.2;Snd.mus.connect(Snd.master);
 Snd.fx=c.createGain();Snd.fx.gain.value=.6;Snd.fx.connect(Snd.master);
 Snd.bassF=c.createBiquadFilter();Snd.bassF.type='lowpass';Snd.bassF.frequency.value=500;Snd.bassF.connect(Snd.mus);
 const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;Snd.noise=b;
 Snd.next=c.currentTime+.1;setInterval(sched,25);
}
function env(g,t,a,p,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function osc(type,f,t,dur,vol,dest,f2){const c=Snd.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);env(g,t,.006,vol,dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05)}
function noise(t,dur,vol,dest,type,freq){const c=Snd.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=Snd.noise;f.type=type;f.frequency.value=freq;env(g,t,.004,vol,dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random()*.5);s.stop(t+dur+.05)}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const BPM=128,SD=60/BPM/4;
const CH=[[50,53,57],[46,50,53],[48,52,55],[45,49,52]];
function sched(){const c=Snd.ctx;while(Snd.next<c.currentTime+.15){mstep(Snd.step,Snd.next);Snd.next+=SD;Snd.step=(Snd.step+1)%64}}
function mstep(s,t){
 if(!Snd.musicOn||G.state!=='play')return;
 const ch=CH[Math.floor(s/16)],k=s%16,M=Snd.mus;
 if(k%4===0)osc('sine',150,t,.18,.9,M,42);
 if(k===4||k===12){noise(t,.13,.32,M,'highpass',1700);osc('triangle',200,t,.07,.18,M,130)}
 noise(t,.03,k%2?.05:.1,M,'highpass',7500);
 if(k%2===0)osc('sawtooth',mtof(ch[0]-24+(k===10||k===14?12:0)),t,SD*1.4,.3,Snd.bassF);
 const arp=[0,1,2,1,0,2,1,2];if(k%2===1||Snd.intense)osc('square',mtof(ch[arp[k%8]]+12),t,SD*.8,Snd.intense?.05:.035,M);
 if(k===0&&s%32===0)osc('sawtooth',mtof(ch[2]+12),t,SD*6,.04,M);
}
function fx(fn){if(!Snd.ctx||!Snd.fxOn)return;fn(Snd.ctx.currentTime+.005)}
const SFX={
 shoot(){fx(t=>{osc('square',1200,t,.07,.06,Snd.fx,500);noise(t,.04,.08,Snd.fx,'highpass',3000)})},
 eshoot(){fx(t=>noise(t,.08,.07,Snd.fx,'bandpass',900))},
 hit(){fx(t=>osc('triangle',300,t,.06,.12,Snd.fx,150))},
 capture(){fx(t=>{osc('square',523,t,.08,.1,Snd.fx);osc('square',784,t+.07,.08,.1,Snd.fx);osc('square',1047,t+.14,.15,.1,Snd.fx)})},
 rescue(){fx(t=>[72,76,79,84].forEach((n,i)=>osc('triangle',mtof(n),t+i*.07,.22,.18,Snd.fx)))},
 hurt(){fx(t=>{osc('sawtooth',180,t,.18,.2,Snd.fx,80);noise(t,.12,.15,Snd.fx,'lowpass',800)})},
 bad(){fx(t=>{osc('square',300,t,.15,.12,Snd.fx);osc('square',220,t+.15,.25,.12,Snd.fx)})},
 pickup(){fx(t=>{osc('sine',880,t,.08,.15,Snd.fx,1320);osc('sine',1320,t+.08,.12,.12,Snd.fx,1760)})},
 boom(){fx(t=>{noise(t,.6,.5,Snd.fx,'lowpass',500);osc('sine',90,t,.5,.7,Snd.fx,30)})},
 win(){fx(t=>[60,64,67,72,67,72,76,79].forEach((n,i)=>osc('square',mtof(n),t+i*.13,.28,.1,Snd.fx)))},
 lose(){fx(t=>[64,62,60,55].forEach((n,i)=>osc('triangle',mtof(n),t+i*.3,.5,.2,Snd.fx)))},
 radio(){fx(t=>{noise(t,.25,.12,Snd.fx,'bandpass',1800);osc('sine',1500,t+.22,.07,.12,Snd.fx);osc('sine',1500,t+.33,.07,.12,Snd.fx)})},
 ashoot(){fx(t=>{osc('square',900,t,.05,.03,Snd.fx,450)})},
 mg(){fx(t=>noise(t,.05,.12,Snd.fx,'bandpass',1400))},
 rocket(){fx(t=>{noise(t,.5,.18,Snd.fx,'bandpass',600);osc('sawtooth',300,t,.5,.06,Snd.fx,90)})},
 alarm(){fx(t=>{for(let i=0;i<3;i++){osc('sawtooth',660,t+i*.32,.15,.1,Snd.fx);osc('sawtooth',500,t+i*.32+.16,.15,.1,Snd.fx)}})}
};
let esVoice=null;
function loadVoices(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices();esVoice=v.find(x=>/^es[-_](419|MX|US|DO|CO|AR)/i.test(x.lang))||v.find(x=>/^es/i.test(x.lang))||null}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
let lastSay=0;
function say(t,force){if(!Snd.fxOn||!('speechSynthesis' in window))return;const now=performance.now();if(!force&&now-lastSay<3500)return;lastSay=now;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=esVoice?esVoice.lang:'es-ES';if(esVoice)u.voice=esVoice;u.rate=1.08;speechSynthesis.speak(u)}catch(e){}}

SFX.cannon=()=>fx(t=>{noise(t,.7,.7,Snd.fx,'lowpass',350);osc('sine',70,t,.6,.9,Snd.fx,25)});
SFX.engine=()=>fx(t=>{osc('sawtooth',60,t,.6,.12,Snd.fx,120);noise(t,.5,.1,Snd.fx,'lowpass',400)});
SFX.splash=()=>fx(t=>noise(t,.6,.35,Snd.fx,'bandpass',500));

/* ================= MISIONES ================= */

 {n:'Croix-des-Bouquets',t:'city',st:1,cap:10,res:5,max:5,fast:.1,barr:10,g:'#cdb98c',lead:['Mano Negra','🖐️',0,'#111827'],sub:'Barricadas en llamas bloquean las calles.',b:'Croix-des-Bouquets está llena de barricadas. Destrúyalas y atrape al líder, Mano Negra.'},
 {n:'Bahía de Puerto Príncipe',t:'coast',st:1,cap:6,res:3,max:4,fast:.05,barr:3,boats:2,g:'#d6c49b',lead:['La Barracuda','🐟',1,'#0ea5e9'],sub:'Lanchas de las bandas atacan desde el mar.',b:'¡Ataque por mar en la bahía de Puerto Príncipe! Suba a la lancha de la patrulla marítima en el muelle y hunda las lanchas de La Barracuda.'},
 {n:'Martissant',t:'city',st:1,cap:12,res:5,max:5,fast:.15,barr:8,g:'#d2bd90',lead:['El Toro','🐂',0,'#7c2d12'],sub:'Las bandas controlan la entrada sur de la capital.',b:'Martissant es la puerta sur de la capital. Libere la zona y capture a El Toro.'},
 {n:'Penitenciaría Nacional',t:'prison',st:2,cap:0,res:0,max:5,fast:.1,barr:4,defend:60,g:'#cfc0a0',lead:['El Cuervo','🐦',0,'#1f2937'],sub:'Las bandas quieren liberar a sus jefes presos.',b:'El Cuervo dirige un asalto contra la Penitenciaría Nacional. Defienda la cárcel durante sesenta segundos y neutralice a El Cuervo cuando aparezca.'},
 {n:'Ruta Nacional 1',t:'city',st:2,cap:14,res:6,max:6,fast:.4,barr:8,g:'#c7b07e',lead:['El Motorista','🏍️',0,'#ea580c'],sub:'Pandilleros en moto extorsionan a los camiones.',b:'Las bandas bloquean la Ruta Nacional uno. Cuidado con las motos de El Motorista.'},
 {n:'Puerto de Saint-Marc',t:'coast',st:2,cap:8,res:4,max:5,fast:.1,barr:4,boats:4,g:'#d4c095',lead:['El Contrabandista','📦',1,'#a16207'],sub:'Contrabando de armas por mar.',b:'El Contrabandista recibe armas por mar en Saint-Marc. Hunda sus lanchas y capture su barco.'},

 {n:'Cárcel de Croix-des-Bouquets',t:'prison',st:3,cap:0,res:0,max:6,fast:.15,barr:6,defend:75,g:'#c9b48a',lead:['El Martillo','🔨',0,'#57534e'],sub:'Un asalto masivo contra la cárcel civil.',b:'El Martillo quiere derribar los muros de la cárcel de Croix-des-Bouquets. Resista setenta y cinco segundos.'},

const TICON={city:'🏙️',coast:'🌊',prison:'🔒'};

function eFire(src,ang,spd,spreads,off){spreads.forEach(s=>{const a=ang+s;EB.push({x:src.x+Math.cos(a)*off,y:src.y+Math.sin(a)*off,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,l:0})})}

 // pandilleros a pie

  else if(d<620){const want=e.fast?0:e.boss?200:230;if(d>want){vx=dx/d;vy=dy/d}else if(!e.fast){const s=Math.sin(G.t*1.3+i)>0?1:-1;vx=-dy/d*s*.7;vy=dx/d*s*.7}}

  let gx=b.x,gy=b.y;

  else{gx=cl(P.x+Math.sin(G.t*.5+i*2)*240,80,WS-80);gy=W.seaY+(b.boss?280:170)+Math.sin(G.t*.8+i)*50}
  const dx=gx-b.x,dy=gy-b.y,d=Math.hypot(dx,dy);
  if(d>4){const sp=Math.min(b.sp*dt,d);if(!boatBlocked(b.x+dx/d*sp,b.y,b.r))b.x+=dx/d*sp;if(!boatBlocked(b.x,b.y+dy/d*sp,b.r))b.y+=dy/d*sp;b.hd=angLerp(b.hd,Math.atan2(dy,dx),dt*3);if(Math.random()<dt*18)wake(b.x,b.y,b.hd)}
  let tg=P,td=Math.hypot(P.x-b.x,P.y-b.y);for(const a of AL){if(a.hp<=0||a.leave)continue;const q=Math.hypot(a.x-b.x,a.y-b.y);if(q<td){td=q;tg=a}}
  b.ang=Math.atan2(tg.y-b.y,tg.x-b.x);b.cd-=dt;
  if(td<(b.boss?560:500)&&b.cd<=0){if(b.boss)bossAttack(b);else{eFire(b,b.ang+rand(-.1,.1),280,[-.08,.08],26);SFX.eshoot();b.cd=rand(1,1.8)*D.ecd}}}
 // balas enemigas
 for(let i=EB.length-1;i>=0;i--){const b=EB[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.l+=dt;let dead=b.l>2.2||inRect(b.x,b.y);
  if(!dead&&Math.hypot(b.x-P.x,b.y-P.y)<(P.inBoat?22:P.r+3)){dead=true;hurt(9)}
  if(!dead)for(const a of AL){if(a.hp>0&&!a.leave&&Math.hypot(b.x-a.x,b.y-a.y)<a.r+3){dead=true;hurtAlly(a,9);break}}
  if(dead)EB.splice(i,1)}
 // civiles
 for(const c of CV){c.t-=dt;
  if(c.state==='saved'){c.sv+=dt;continue}
  if(c.state==='flee'){c.flee-=dt;const a=Math.atan2(c.y-P.y,c.x-P.x);moveEnt(c,Math.cos(a)*150*dt,Math.sin(a)*150*dt);c.ang=a;if(c.flee<=0)c.state='idle'}
  else{if(c.t<=0){c.t=rand(1,3);const a=rand(0,6.28),m=Math.random()<.4?0:rand(20,45);c.vx=Math.cos(a)*m;c.vy=Math.sin(a)*m;if(m)c.ang=a}moveEnt(c,c.vx*dt,c.vy*dt);
   if(!P.inBoat&&Math.hypot(c.x-P.x,c.y-P.y)<c.r+P.r+6)rescueCiv(c)}}

 if(L.res&&CV.filter(c=>c.state!=='saved').length<3&&G.res<L.res){const p=roadPoint(500);CV.push(mkCiv(p.x,p.y))}

 // recogibles
 G.pickT-=dt;if(G.pickT<=0){G.pickT=rand(9,14);const p=roadPoint(250);PK.push({x:p.x,y:p.y,k:pick(['med','med','shield','triple','aid'])})}

function updSupport(dt){

requestAnimationFrame(loop);

/* ================= PANTALLAS ================= */
function modal(h){$('#modal').innerHTML=`<div class="modal"><div class="card">${h}</div></div>`}
function closeModal(){$('#modal').innerHTML=''}
function showPlayUI(on){$('#hud').style.display=on?'flex':'none';$('#radio').style.display=on?'flex':'none';$('#fire').style.display=on&&matchMedia('(pointer:coarse)').matches?'flex':'none';if(!on)$('#board').style.display='none';G.ctxB='x'}
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function menu(){
 G.state='menu';showPlayUI(false);
 const nx=Math.min(unlocked,LEVELS.length)-1;
 modal(`<div class="big">🇭🇹</div><h1>Operación Amanecer</h1><div style="font-weight:800;color:#fbbf24">Edición de acción · 20 misiones</div><div class="flag"></div>
 <p>Eres agente de la Policía Nacional. Captura pandilleros, <b>neutraliza al líder de cada banda</b>, defiende las cárceles, combate en tierra y mar y <b>pide refuerzos por radio</b>.</p>
 <button class="btn" id="cont">▶ ${unlocked>1?'Continuar':'Empezar'}: Misión ${nx+1}</button>
 <h3>1. Elige tu rango de dificultad</h3>
 <div class="dgrid">${DIFFS.map((d,i)=>`<button class="dc ${i===G.diff?'sel':''}" data-d="${i}"><b>${d.icon} ${d.n}</b><small>Rango: ${d.rank}<br>${d.desc}<br>Puntos ×${d.score}</small></button>`).join('')}</div>
 <h3>2. Misiones (🏙️ ciudad · 🌊 costa · 🔒 cárcel)</h3>
 ${LEVELS.map((L,i)=>`<button class="mi" data-m="${i}" ${i>=unlocked?'disabled':''}><span style="font-size:20px">${i<unlocked?TICON[L.t]:'🔒'}</span><span><b>${i+1}. ${L.n}</b><small>${i<unlocked?L.sub:'Completa la misión anterior para desbloquearla.'}</small><span class="ld">Líder: ${L.lead[1]} ${L.lead[0]}</span></span><span class="stars">${stars(L.st)}</span></button>`).join('')}
 <div id="instBox"></div>
 <button class="btn b2" id="how" style="margin-top:10px">❔ Cómo jugar</button>
 <p class="note">Juego de ficción. Los personajes, líderes, bandas y sucesos son inventados. Tu arma es un aturdidor: los pandilleros quedan detenidos 🔗 y van a la cárcel.</p>`);
 document.querySelectorAll('.dc').forEach(b=>b.onclick=()=>{audioInit();G.diff=+b.dataset.d;D=DIFFS[G.diff];SFX.pickup();menu()});
 document.querySelectorAll('.mi').forEach(b=>b.onclick=()=>{audioInit();G.lvl=+b.dataset.m;G.score=0;brief()});
 $('#cont').onclick=()=>{audioInit();G.lvl=nx;G.score=0;brief()};
 $('#how').onclick=howTo;
 renderInstall();
}
/* ===== INSTALACIÓN (app descargable) ===== */
let deferredPrompt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function renderInstall(){const box=$('#instBox');if(!box)return;
 if(isStandalone()){box.innerHTML='<p class="note">✅ Juego instalado. Funciona sin internet.</p>';return}
 if(deferredPrompt){box.innerHTML='<button class="btn" id="inst" style="background:linear-gradient(#22c55e,#15803d);color:#fff">📲 Descargar e instalar el juego</button><p class="note">Se instala en tu teléfono y funciona sin internet.</p>';
  $('#inst').onclick=async()=>{deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;renderInstall()};return}
 if(isIOS()){box.innerHTML='<p class="note">📲 Para instalarlo en iPhone: toca <b>Compartir</b> ⬆️ y luego <b>Añadir a pantalla de inicio</b>.</p>';return}
 box.innerHTML='<p class="note">📲 Para instalarlo: abre el menú del navegador (⋮) y elige <b>Instalar app</b> o <b>Añadir a pantalla de inicio</b>.</p>'}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;renderInstall()});
addEventListener('appinstalled',()=>{deferredPrompt=null;renderInstall();say('¡Juego instalado!',true)});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
function howTo(){
 modal(`<h2>❔ Cómo jugar</h2><ul>
 <li>📱 <b>Móvil:</b> arrastra el dedo para moverte y mantén pulsado <b>🎯 DISPARAR</b> (apunta solo).</li>
 <li>💻 <b>Computadora:</b> WASD o flechas para moverte, ratón para apuntar, clic o espacio para disparar. <b>R</b> abre la radio, <b>1–9</b> piden refuerzos, <b>E</b> sube o baja de la lancha.</li>
 <li>🎯 <b>Cada misión tiene un líder de banda.</b> Aparece cuando cumples los otros objetivos (o a mitad de la defensa de una cárcel). Neutralízalo para ganar.</li>
 <li>🌊 <b>Misiones costeras:</b> las bandas atacan por mar. Ve al muelle y pulsa <b>🚤 SUBIR</b> para manejar la lancha de la patrulla marítima.</li>
 <li>🔒 <b>Misiones de cárcel:</b> protege los muros hasta que acabe el tiempo. Todos los pandilleros capturados van a la cárcel.</li>
 <li>📻 <b>Refuerzos:</b> 🛡️ GSF · 🕶️ Seguridad privada · 🇺🇸 Unidad EE. UU. · 🇸🇻 Unidad El Salvador · 🇨🇴 Tanques de Colombia · 🚤 Patrulla marítima · 🚢 Buque de la Guardia Costera · 🚁 Helicóptero de ataque · 🚑 Helicóptero de rescate.</li>
 <li>🙋 Toca a los civiles para rescatarlos. ¡No les dispares!</li>
 <li>★ Las estrellas indican la dificultad de cada misión (1 a 5). Tu rango multiplica los puntos.</li></ul>
 <button class="btn" id="bk">Volver</button>`);$('#bk').onclick=menu}
function brief(){
 G.state='brief';showPlayUI(false);const L=curL();
 const ob=[];if(L.cap)ob.push(`🔗 Capturar ${L.cap}`);if(L.res)ob.push(`🤝 Rescatar ${L.res}`);if(L.boats)ob.push(`🚤 Hundir ${L.boats} lanchas`);if(L.defend)ob.push(`🔒 Defender la cárcel ${L.defend} s`);ob.push(`${L.lead[1]} Neutralizar a ${L.lead[0]}`);
 modal(`<div style="color:#93c5fd;font-weight:700">MISIÓN ${G.lvl+1} DE ${LEVELS.length} · <span style="color:#fbbf24">${stars(L.st)}</span></div><div class="note">${TICON[L.t]} ${{city:'Ciudad',coast:'Costa',prison:'Cárcel'}[L.t]} · ${D.icon} ${D.n} · Rango ${D.rank}</div><h2>📍 ${L.n}</h2><p>${L.sub}</p>
 <div>${ob.map(x=>`<span class="obj">${x}</span>`).join('')}</div>
 <p class="note" style="margin-top:8px">📻 Pulsa REFUERZOS para pedir ayuda por radio.${L.t==='coast'?' En la costa también tienes patrulla marítima y buque de la Guardia Costera.':''}</p>
 <button class="btn" id="go" style="margin-top:6px">¡En marcha!</button> <button class="btn b2" id="mn">Menú</button>`);
 say(L.b,true);
 $('#mn').onclick=menu;
 $('#go').onclick=()=>{audioInit();closeModal();startLevel();G.lvlStart=G.score;G.state='play';showPlayUI(true);$('#hint').style.display=matchMedia('(pointer:coarse)').matches?'block':'none';banner(`📍 ${L.n}`)};
}
function levelDone(){
 G.state='done';showPlayUI(false);firing=false;joy=null;SFX.win();const L=curL();
 const bonus=Math.max(0,Math.round(600-G.lvlTime*3)),hb=Math.round(P.hp*5);G.score+=bonus+hb;
 const dBonus=Math.round((G.score-(G.lvlStart||0))*(D.score-1));G.score+=dBonus;
 unlocked=Math.max(unlocked,Math.min(LEVELS.length,G.lvl+2));try{localStorage.setItem('oa_unlock20',unlocked)}catch(e){}
 if(G.lvl===LEVELS.length-1){say('¡Victoria total! Los veinte líderes de las bandas están en la cárcel. Haití vuelve a tener paz.',true);
  modal(`<div class="big">🏆</div><h1>¡Haití en paz!</h1><p>Completaste las 20 misiones y neutralizaste a los 20 líderes de las bandas. Las familias regresan a sus casas, los mercados se llenan y los niños vuelven a la escuela.</p><p>🔒 Pandilleros enviados a la cárcel: <b>${G.prisoners}</b><br>Rango: <b>${D.icon} ${D.rank}</b></p><div class="big" style="font-size:30px">⭐ ${G.score}</div><button class="btn" id="go">Menú principal</button>`);
  $('#go').onclick=menu;return}
 say(`¡Misión cumplida! ${L.lead[0]} está en la cárcel.`,true);
 modal(`<div class="big">✅</div><h2>¡Misión cumplida!</h2><p>${L.n} está libre y <b>${L.lead[1]} ${L.lead[0]}</b> va camino a la cárcel.</p><ul><li>Bonificación por tiempo: <b>+${bonus}</b></li><li>Bonificación por salud: <b>+${hb}</b></li><li>Dificultad ${D.n} (×${D.score}): <b>${dBonus>=0?'+':''}${dBonus}</b></li><li>🔒 Total en la cárcel: <b>${G.prisoners}</b></li></ul><div class="big" style="font-size:28px">⭐ ${G.score}</div><button class="btn" id="go">Siguiente misión ▶</button><button class="btn b2" id="mn">Menú</button>`);
 $('#go').onclick=()=>{G.lvl++;brief()};$('#mn').onclick=menu;
}
function gameOver(why){
 G.state='over';showPlayUI(false);firing=false;joy=null;SFX.lose();
 const prison=why==='prison';say(prison?'Los muros de la cárcel han caído. Los presos escapan. ¡Inténtelo de nuevo!':'Agente herido. La misión ha fallado. ¡Inténtelo de nuevo!',true);
 modal(`<div class="big">${prison?'🧱':'🚑'}</div><h2>${prison?'¡La cárcel cayó!':'Agente evacuado'}</h2><p>${prison?'Las bandas derribaron los muros y los presos escaparon.':'Has sido herido y el equipo médico te ha retirado de '+LEVELS[G.lvl].n+'.'}</p><div class="big" style="font-size:26px">⭐ ${G.score}</div><button class="btn" id="go">🔄 Reintentar misión</button><button class="btn b2" id="mn">Menú</button>`);
 $('#go').onclick=()=>{G.score=Math.max(0,G.score-300);brief()};$('#mn').onclick=menu;
}
function togglePause(){
 if(G.state==='play'){G.state='pause';firing=false;joy=null;modal(`<div class="big">⏸️</div><h2>Pausa</h2><button class="btn" id="go">▶ Continuar</button><button class="btn b2" id="mn">Menú</button>`);$('#go').onclick=togglePause;$('#mn').onclick=menu}
 else if(G.state==='pause'){closeModal();G.state='play'}
}
$('#bPause').onclick=togglePause;
$('#radio').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audioInit();openRadio()});
$('#bMus').onclick=()=>{audioInit();Snd.musicOn=!Snd.musicOn;$('#bMus').classList.toggle('off',!Snd.musicOn)};
$('#bFx').onclick=()=>{audioInit();Snd.fxOn=!Snd.fxOn;$('#bFx').classList.toggle('off',!Snd.fxOn);if(!Snd.fxOn&&'speechSynthesis' in window)speechSynthesis.cancel()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')togglePause()});
menu();

</script>
</body>
</html>
